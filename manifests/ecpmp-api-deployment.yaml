apiVersion: batch/v1
kind: CronJob
metadata:
  name: django-management-command-job
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: django-management-command
              image: ECR_IMAGE
              command: ["/bin/sh", "-c"]
              args: ["python manage.py send_reminders_for_milestone; python manage.py send_open_invoice_reminder; python manage.py remove_already_deleted_contact_users_and_contact_companies; python manage.py send_reminer_for_time_expense_card; python manage.py send_reminders_for_expiring_po;"]
              env:
                - name: DB_NAME
                  value: "DB_NAME"
