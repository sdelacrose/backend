     app: ecpmp-app

---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
  - port: 6379
  selector:
    app: redis

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matrix-data-pvc
spec:
  storageClassName: gp3-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix
  template:
    metadata:
      labels:
        app: matrix
    spec:
      initContainers:
      - name: generate-synapse-config
        image: matrixdotorg/synapse:latest
        args: ["generate"]
        env:
        - name: SYNAPSE_SERVER_NAME
          value: "localhost"
        - name: SYNAPSE_REPORT_STATS
          value: "no"
        volumeMounts:
        - name: matrix-data
          mountPath: /data
      - name: patch-synapse-config
        image: alpine:3.20
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            sed -i 's/^enable_registration:.*/enable_registration: true/' /data/homeserver.yaml || true
            if ! grep -q '^enable_registration_without_verification:' /data/homeserver.yaml; then
              echo 'enable_registration_without_verification: true' >> /data/homeserver.yaml
            else
              sed -i 's/^enable_registration_without_verification:.*/enable_registration_without_verification: true/' /data/homeserver.yaml || true
            fi
        volumeMounts:
        - name: matrix-data
          mountPath: /data
      containers:
      - name: matrix
        image: matrixdotorg/synapse:latest
        env:
        - name: SYNAPSE_CONFIG_PATH
          value: "/data/homeserver.yaml"
        ports:
        - containerPort: 8008
        readinessProbe:
          httpGet:
            path: /_matrix/client/versions
            port: 8008
          initialDelaySeconds: 20
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /_matrix/client/versions
            port: 8008
          initialDelaySeconds: 40
          periodSeconds: 20
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        volumeMounts:
        - name: matrix-data
          mountPath: /data
      volumes:
      - name: matrix-data
        persistentVolumeClaim:
          claimName: matrix-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: matrix
spec:
  ports:
  - port: 8008
    targetPort: 8008
    protocol: TCP
    name: http
  selector:
    app: matrix

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: default
  name: ecpmp-app-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: ACM_CERTIFCATE
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/actions.ssl-redirect: >
      {"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
spec:
  ingressClassName: alb
  rules:
    - host: sharemundo-backend.foliumaitech.com
      http:
        paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: ecpmp-app-service-alb
              port:
                number: 8000
    - host: sharemundo-administration-backend.foliumaitech.com
      http:
        paths:
        - path: /admin-api/
          pathType: Prefix
          backend:
            service:
              name: admin-server-app-service-alb
              port:
                number: 8001


