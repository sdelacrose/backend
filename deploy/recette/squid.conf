# LINKS-RECETTE-03B: the ONLY way out of the recette environment.
# HTTPS (CONNECT) to the three destinations the application legitimately needs, nothing else.
# Narrow .auth0.com to the recette tenant's own host (e.g. links-recette.eu.auth0.com) once it exists.
http_port 3128

acl recette_nets src 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
acl tls_port port 443
acl connect_method method CONNECT
acl allowed_hosts dstdomain login.microsoftonline.com graph.microsoft.com .auth0.com

http_access deny !recette_nets
http_access deny !tls_port
http_access allow connect_method allowed_hosts
http_access deny all

cache deny all
forwarded_for delete
