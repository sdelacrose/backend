# LINKS-RECETTE-04B: the ONLY way out of the recette environment.
# HTTPS (CONNECT, port 443) to the Microsoft hosts the application needs and to ONE Auth0 tenant host,
# nothing else. The Auth0 tenant host is data, not code: put the exact host of the recette tenant
# (e.g. links-recette.eu.auth0.com) alone on a line of auth0-tenant.txt. While that file only
# contains comments, Auth0 is refused (never ".auth0.com", which would allow every tenant).
http_port 3128

acl recette_nets src 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
acl tls_port port 443
acl connect_method method CONNECT
acl microsoft_hosts dstdomain login.microsoftonline.com graph.microsoft.com
acl auth0_tenant dstdomain "/etc/squid/auth0-tenant.txt"

http_access deny !recette_nets
http_access deny !tls_port
http_access allow connect_method microsoft_hosts
http_access allow connect_method auth0_tenant
http_access deny all

cache deny all
forwarded_for delete
